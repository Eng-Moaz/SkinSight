---
- name: Install Docker on both servers
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Install Docker
      ansible.builtin.dnf:
        name: [docker, python3-requests]
        state: present

    - name: Start Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

- name: Deploy the backend
  hosts: backend
  become: true
  tasks:
    - name: Run the prediction service
      community.docker.docker_container:
        name: prediction-service
        image: ghcr.io/eng-moaz/skinsight/prediction-service:latest
        pull: always
        restart_policy: unless-stopped
        published_ports: ["8000:8000"]

    - name: Wait until the backend is healthy
      ansible.builtin.uri:
        url: http://localhost:8000/health
      register: health
      until: health.status == 200
      retries: 20
      delay: 5

- name: Deploy the frontend
  hosts: frontend
  become: true
  tasks:
    - name: Run the frontend
      community.docker.docker_container:
        name: frontend
        image: ghcr.io/eng-moaz/skinsight/frontend:latest
        pull: always
        restart_policy: unless-stopped
        published_ports: ["80:8080"]
        env:
          BACKEND_URL: "http://{{ backend_private_ip }}:8000"

    - name: Check that the frontend reaches the backend
      ansible.builtin.uri:
        url: http://localhost/api/health
      register: health
      until: health.status == 200
      retries: 20
      delay: 5
